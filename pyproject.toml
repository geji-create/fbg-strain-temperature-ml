[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "fbg-ml-reproduction"
version = "0.1.0"
description = "Reproduction scaffold for strain-temperature discrimination with a uniform FBG"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "scipy",
  "pandas",
  "matplotlib",
  "seaborn",
  "scikit-learn",
  "joblib",
  "openpyxl",
]

[tool.setuptools.packages.find]
where = ["src"]

